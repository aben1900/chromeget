<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收集内容</title><link rel="stylesheet" href="collect.css"><link rel="stylesheet" href="recovery.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="delete-icons.css"><link rel="stylesheet" href="icon-buttons.css"></head><body><main>
<section class="input-card"><textarea id="collectInput" rows="10" maxlength="160000" aria-label="想收集什么？" placeholder="想收集什么？一句话、一段提示词，或一个视频、图集、文件网址"></textarea><button id="useCurrentPage" class="secondary">识别当前网页</button><span id="inputKind" role="status"></span></section>
<section id="previewCard" hidden><div class="section-heading"><h2>收集预览</h2><span id="previewLabel"></span></div><p id="collectPreview"></p><div id="textOptions"><label for="collectType">保存为</label><select id="collectType"><option>内容</option><option>提示词</option><option>评论</option><option>评阅</option></select><div id="titleField" hidden><label for="collectTitle">提示词标题</label><input id="collectTitle" maxlength="120"></div></div><div id="bookmarkFields" hidden><label for="bookmarkTitle">名称（必填，最多 120 字）</label><input id="bookmarkTitle" maxlength="120" required><label for="bookmarkNote">备注（可选，最多 2000 字）</label><textarea id="bookmarkNote" rows="3" maxlength="2000"></textarea><label for="bookmarkAuthor">作者（可选，最多 120 字）</label><input id="bookmarkAuthor" maxlength="120"></div><p id="collectHint" title="">保存文件：正在读取…</p><div class="actions"><button id="chooseSaveFile" type="button" title="设置保存文件" aria-label="设置保存文件"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/><path d="M12 11v6m-3-3 3 3 3-3"/></svg></button><button id="saveCollect">确认保存</button><button id="downloadCollect" hidden>切换到相关下载页</button><button id="batchCollect" hidden class="secondary">前往批量下载</button></div></section>
<section id="duplicatePanel" hidden><p>资料库已有相同内容。</p><a id="existingRecord" target="_blank" rel="noopener">查看已有资料 ↗</a><button id="saveDuplicate">仍然保存一份</button></section>
<p id="collectStatus" role="status" aria-live="polite"></p><div id="collectError" role="alert"></div><button id="checkCollect" class="secondary" hidden>检查保存状态</button>
</main><script src="collect-model.js"></script><script src="prompt-title.js"></script><script src="video-url.js"></script><script src="recovery.js"></script><script src="collect.js"></script><script src="recovery-page.js"></script><script src="delete-icons.js"></script></body></html>
