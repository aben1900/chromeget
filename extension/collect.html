<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收集内容</title><link rel="stylesheet" href="collect.css"><link rel="stylesheet" href="recovery.css"></head><body><main>
<div class="intro"><span class="eyebrow">从这里开始</span><h1>值得留下的，一处收好。</h1><p>粘贴文字或网址，预览后再保存。</p></div>
<section class="input-card"><label for="collectInput">想收集什么？</label><textarea id="collectInput" rows="5" maxlength="160000" placeholder="一句话、一段提示词，或一个视频、图集、文件网址"></textarea><button id="useCurrentPage" class="secondary">使用当前网页</button><span id="inputKind" role="status"></span></section>
<section id="previewCard" hidden><div class="section-heading"><h2>收集预览</h2><span id="previewLabel"></span></div><p id="collectPreview"></p><div id="textOptions"><label for="collectType">保存为</label><select id="collectType"><option>内容</option><option>提示词</option><option>评论</option><option>评阅</option></select><div id="titleField" hidden><label for="collectTitle">提示词标题</label><input id="collectTitle" maxlength="120"></div></div><p id="collectHint"></p><div class="actions"><button id="saveCollect">确认保存</button><button id="downloadCollect" hidden>下载内容</button><button id="batchCollect" hidden class="secondary">前往批量下载</button></div></section>
<p id="collectStatus" role="status" aria-live="polite"></p><div id="collectError" role="alert"></div><button id="checkCollect" class="secondary" hidden>检查保存状态</button>
<p class="footnote">资料保存在本机。视频、图集与模型会先选择内容，再确认下载。</p>
</main><script src="collect-model.js"></script><script src="prompt-title.js"></script><script src="video-url.js"></script><script src="recovery.js"></script><script src="collect.js"></script><script src="recovery-page.js"></script></body></html>
