<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件类</title><link rel="stylesheet" href="prompt.css"><link rel="stylesheet" href="video.css"><link rel="stylesheet" href="embedded.css"><link rel="stylesheet" href="task-ui.css"><link rel="stylesheet" href="download.css"><link rel="stylesheet" href="interface.css"><link rel="stylesheet" href="recovery.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="delete-icons.css"><link rel="stylesheet" href="icon-buttons.css"></head><body><main class="video-page easy-download">
<section class="video-card download-composer"><button id="backToFileList" class="quiet" hidden>← 返回文件列表</button>
<div class="composer-heading"><span class="step-icon" aria-hidden="true">↓</span><h1>文件下载</h1></div>
<input id="fileUrl" type="url" placeholder="粘贴文件或模型链接" aria-label="下载链接" autocomplete="off" spellcheck="false">

<div class="actions link-shortcuts"><button id="currentLink">识别当前网页</button><button id="pageLinks">识别本页文件</button></div>
<section id="linkResults" hidden><p id="linkCount" role="status"></p><div id="linkList"></div></section>
<div id="filePreview" class="file-preview" hidden aria-live="polite"><span id="previewIcon" class="file-icon">↓</span><div class="preview-copy"><span id="previewKind" class="preview-kind"></span><strong id="previewName"></strong><p id="previewMeta" class="hint"></p></div></div>
<p id="previewHint" class="hint" role="status"></p>
<div class="destination-row"><div><span class="hint">保存到</span><p id="directoryDisplay" title="">正在读取保存位置…</p></div><button id="folder" type="button" title="设置保存目录" aria-label="设置保存目录"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/><path d="M12 11v5m-2-2 2 2 2-2"/></svg></button></div>
<p id="destinationHint" class="hint"></p>
<section id="hfSection" hidden><input id="hfUrl" type="hidden"><div class="model-heading"><h2>仓库文件</h2><div class="model-heading-actions"><button id="hfInspect" type="button" title="刷新仓库文件" aria-label="刷新仓库文件">↻</button><button id="hfSizeSort" type="button" title="文件大小：默认顺序" aria-label="文件大小：默认顺序" data-sort="default" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h10M5 17h6"/></svg></button></div></div><div class="model-selection"><p id="hfSelection" role="status">未选择文件</p><div><button id="hfAll">全选</button><button id="hfNone">清空</button></div></div><div id="hfFiles"></div><button id="hfDownload" disabled>下载所选</button></section>
<button id="fileDownload" class="main-download" disabled>开始下载</button>
<p id="transferStatus" role="status"></p><p id="transferError" role="alert"></p>

</section>
<details class="login-card" id="batchSection"><summary>批量下载</summary><div class="login-content"><textarea id="batchUrls" aria-label="批量下载链接，每行一条，最多30条" rows="4" placeholder="https://example.com/文件1.zip&#10;https://example.com/文件2.pdf"></textarea><button id="batchAdd">加入下载</button><p id="batchResult" role="status"></p></div></details>
<details class="login-card" id="advancedOptions"><summary>下载设置</summary><div class="login-content settings-stack">
<section class="settings-group"><div class="section-heading"><h3>文件信息</h3><button id="probeFile" title="重新识别文件" aria-label="重新识别文件">↻</button></div><label for="fileName">文件名</label><input id="fileName" placeholder="自动识别"><p id="probeResult" class="hint"></p><label for="fileChecksum">SHA-256（可选）</label><input id="fileChecksum" placeholder="发布者提供的校验值" maxlength="64"></section>

<section class="settings-group"><h3>速度与队列</h3><div class="advanced-fields"><label for="transferMode">连接模式</label><select id="transferMode"><option value="extreme">极限 · 64 路（需合并空间）</option><option value="fast">高速 · 32 段 / 最多 16 连接</option><option value="balanced">均衡 · 4 连接</option><option value="compatible">兼容 · 单连接</option></select><div class="queue-settings"><label for="maxActive">同时下载</label><select id="maxActive"><option value="1">1 个任务</option><option value="2">2 个任务</option><option value="3">3 个任务</option><option value="4">4 个任务</option><option value="5">5 个任务</option><option value="6">6 个任务</option><option value="7">7 个任务</option><option value="8">8 个任务</option></select><label class="file-choice"><input id="autoClassify" type="checkbox"><span>按文件类型归类</span></label><label class="file-choice"><input id="adaptive" type="checkbox" checked><span>自动重试与调整并发</span></label><button id="saveDownloadSettings">保存设置</button></div></div></section></div></details>
<section class="video-card file-tasks"><div class="section-heading"><h2>下载任务</h2><select id="taskFilter" aria-label="筛选任务状态"><option value="unfinished" selected>未完成</option><option value="all">全部任务</option><option value="active">进行中</option><option value="queued">排队中</option><option value="starting">准备中</option><option value="running">下载中</option><option value="paused">已暂停</option><option value="failed">中断 / 失败</option><option value="completed">已完成</option></select><button id="refreshTasks" class="refresh-icon" title="刷新任务" aria-label="刷新任务"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></button></div><p id="tasksLoading" class="task-loading" role="status" aria-live="polite" hidden><span class="task-spinner" aria-hidden="true"></span><span>正在加载任务…</span></p><p id="tasksSummary"></p><p id="tasksError" role="alert"></p><div id="tasksList"></div><div class="actions task-pagination" hidden><button id="tasksPrevious" disabled>上一页</button><button id="tasksNext" disabled>下一页</button></div></section></main><script src="recovery.js"></script><script src="task-ui.js"></script><script src="video-url.js"></script><script src="download.js"></script><script src="download-tasks.js"></script><script src="transfers.js"></script><script src="recovery-page.js"></script><script src="delete-icons.js"></script></body></html>
