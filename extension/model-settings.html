<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型设置 · 精彩摘录</title><link rel="stylesheet" href="library.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="model-navigation.css"><link rel="stylesheet" href="tool-page.css"><link rel="stylesheet" href="delete-icons.css"><link rel="stylesheet" href="icon-buttons.css"></head><body><main><h1>模型设置</h1><section id="aiSettings" class="model-settings-panel">
<div class="model-toolbar model-settings-toolbar"><label class="default-model-picker">选择模型<select id="aiDefaultModel" aria-label="默认模型（用于所有智能功能）" disabled><option>正在读取…</option></select></label><div class="ai-actions"><button id="aiAddModel" class="primary" disabled>添加配置</button><button id="aiImportModels" disabled>导入模型</button></div></div>
<details class="ai-filter-options"><summary>查找与筛选配置</summary><div class="model-filters"><label class="model-search">搜索配置、模型或标签<input id="aiModelSearch" type="search" placeholder="配置名称、模型 ID 或标签" maxlength="200"></label><label>标签筛选<select id="aiTagFilter"><option value="">全部标签</option></select></label><label>测试状态筛选<select id="aiStatusFilter"><option value="">全部状态</option><option value="passed">测试成功</option><option value="failed">测试失败</option><option value="untested">未测试</option><option value="unconfigured">未配置密钥</option></select></label><label>排序方式<select id="aiModelSort"><option value="name-asc">名称 A → Z</option><option value="name-desc">名称 Z → A</option><option value="tags">标签 → 名称</option><option value="status">测试状态 → 名称</option></select></label></div><div class="model-list-meta"><label><input id="aiDefaultFirst" type="checkbox" checked>默认置顶</label><span id="aiModelCount" role="status" aria-live="polite"></span><button id="aiClearFilters" type="button">清除筛选</button></div></details><div id="aiModelList" class="model-list"></div>
<p id="aiSettingsStatus" role="status" aria-live="polite"></p><div class="ai-actions"><button id="aiReloadExtension" hidden>重新加载扩展</button></div><p id="aiReloadHint" class="muted" hidden>重新加载后重新打开资料库，未保存的内容需要重新填写。</p>


<dialog id="aiModelDialog" aria-labelledby="aiDialogTitle"><form id="aiModelForm"><div class="model-dialog-heading"><h2 id="aiDialogTitle">添加模型</h2><button type="button" id="aiCloseDialog" aria-label="关闭编辑模型">×</button></div>
<div class="model-config-row model-config-metadata"><label>配置名称<input id="aiLabel" maxlength="200" required></label><label>标签（逗号分隔）<input id="aiTags" maxlength="260" placeholder="例如：SMEC, 个人, 常用" title="最多 10 个标签，每个 24 字"></label><label>供应商预设<select id="aiProvider"><option value="custom">自定义</option><option value="zhipu-free">智谱 · 免费模型</option><option value="siliconflow-free">硅基流动 · 免费模型</option><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="claude">Anthropic</option></select></label></div>
<div id="aiPresetInfo" class="free-model-info" hidden><span>填入自己的 Key → 测试连接 → 保存</span><a id="aiPresetKeyLink" target="_blank" rel="noopener noreferrer">获取 API Key ↗</a><small>免费范围及限额以平台为准；不会自动切换付费模型。</small></div>
<div class="model-config-row model-config-connection"><label>接口地址<input id="aiBaseUrl" type="url" required placeholder="https://example.com/v1"></label><label>API Key（SK）<input id="aiKey" type="password" autocomplete="off" spellcheck="false" placeholder="填写 API Key"></label></div><p id="aiKeyState" class="muted"></p>
<section class="config-catalog"><div class="catalog-heading"><strong>可选模型</strong><button type="button" id="aiDiscoverModels">获取模型清单</button></div><div class="model-test-bar"><label><input id="aiTestTxt" type="checkbox" checked>TXT 文字</label><label><input id="aiTestOcr" type="checkbox">OCR 图片识别</label><select id="aiTestScope" aria-label="测试范围"><option value="current">当前模型</option><option value="all">全部模型</option></select><button type="button" id="aiTest" title="发送文字或测试图片，可能产生用量">测试</button><button type="button" id="aiStopTests" hidden>停止</button></div><span id="aiBatchStatus" role="status" aria-live="polite"></span><div id="aiModelsEditor"></div><div class="catalog-add"><label>模型 ID<input id="aiNewModelId" maxlength="200" placeholder="例如 deepseek-v4-pro"></label><label>显示名称（可选）<input id="aiNewModelLabel" maxlength="200" placeholder="便于识别的名称"></label><button type="button" id="aiAddEntry">添加模型</button></div><div id="aiDiscovered" hidden><div class="catalog-filters"><label>搜索模型<input id="aiCatalogSearch" type="search" placeholder="输入型号关键词"></label><label>用途筛选<select id="aiCatalogScope"><option value="text">通用文本模型</option><option value="all">全部模型</option><option value="strong">高能力参考</option><option value="balanced">均衡</option><option value="fast">轻量快速</option><option value="special">专用模型</option></select></label><label>清单排序<select id="aiCatalogSort"><option value="summary">日常摘要优先</option><option value="strength">能力档位参考</option><option value="speed">轻量优先</option><option value="name">名称</option></select></label></div><p id="aiCatalogCount" role="status"></p><button type="button" id="aiCatalogClear">清空选择</button><div id="aiDiscoveredList"></div><button type="button" id="aiApplyDiscovered">加入所选模型</button></div><input type="hidden" id="aiModel"></section><label>接口协议<select id="aiProtocol"><option value="chat-completions">OpenAI 兼容 · Chat Completions</option><option value="responses">OpenAI · Responses</option><option value="anthropic">Anthropic · Messages</option></select></label>
<label id="aiAuthLabel" hidden>认证方式<select id="aiAuth"><option value="bearer">Bearer Token</option><option value="x-api-key">x-api-key</option></select></label>
<p id="aiDialogStatus" role="status" aria-live="polite"></p><div class="model-dialog-footer"><span class="model-dialog-spacer"></span><button type="button" id="aiCancelDialog">取消</button><button type="submit" id="aiSaveSettings" class="primary">保存</button></div></form></dialog>
<dialog id="aiImportDialog" aria-labelledby="aiImportTitle"><div class="model-dialog-heading"><h2 id="aiImportTitle">导入模型</h2><button id="aiCloseImport" aria-label="关闭导入模型">×</button></div><div class="ai-actions"><button id="aiImportWorkBuddy">读取 WorkBuddy</button><button id="aiImportCc">读取 CC-Switch</button></div><div id="aiImportList"></div><p id="aiImportStatus" role="status" aria-live="polite"></p><button id="aiApplyImport" class="primary" disabled>导入所选模型</button></dialog>
</section>
</main><script src="library-ai-api.js"></script><script src="library-ai-view.js"></script><script src="library-ai-settings.js"></script><script src="delete-icons.js"></script><script src="window-overlay.js"></script><script src="tool-page.js"></script></body></html>
