<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>精彩摘录</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="content-capture.css"><link rel="stylesheet" href="embedded.css"><link rel="stylesheet" href="interface.css"><link rel="stylesheet" href="recovery.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="delete-icons.css"><link rel="stylesheet" href="icon-buttons.css"></head>
<body><main><section id="contentCapture"><div class="content-capture-toolbar"><h2>截图提取文字</h2><button id="captureContent" title="文字识别 · Windows 本地 OCR" aria-label="文字识别 · Windows 本地 OCR"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 4H6a2 2 0 0 0-2 2v2m12-4h2a2 2 0 0 1 2 2v2M4 16v2a2 2 0 0 0 2 2h2m12-4v2a2 2 0 0 1-2 2h-2"/><text x="12" y="16" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">文</text></svg></button></div><select id="ocrLanguage" aria-label="识别语言"><option value="zh-Hans-CN">识别语言 · 中文（含英文）</option><option value="en-US">识别语言 · English</option><option value="auto">识别语言 · 系统默认</option></select><p id="ocrStatus" role="status" aria-live="polite"></p><div id="ocrEditor" hidden><details class="ocr-preview"><summary>查看截图</summary><img id="ocrImage" alt="所选截图预览"></details><label for="ocrText">识别文字（可编辑）</label><textarea id="ocrText" maxlength="160000" rows="14"></textarea><div id="ocrTitleField" hidden><label id="ocrTitleLabel" for="ocrTitle">标题</label><input id="ocrTitle" maxlength="120"></div><div id="ocrNoteField" hidden><label for="ocrNote">链接备注</label><textarea id="ocrNote" maxlength="2000" rows="2"></textarea></div><div class="ocr-save-row"><select id="ocrType" aria-label="保存类型"><option>内容</option><option>评论</option><option>评阅</option><option>提示词</option><option value="网页地址">链接</option></select><button id="saveOcr">确认保存文字</button></div></div></section><section id="library"><div class="toolbar section-heading"><h2>已保存内容</h2><button id="reload" class="secondary refresh-icon" title="刷新" aria-label="刷新"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></button></div>
<details><summary>查看其他摘录文件</summary><p class="label">这里只切换查看内容，不改变新摘录的保存位置。</p><div class="toolbar equal-actions"><button id="chooseJson" class="secondary">选择 JSON 文件</button><button id="defaultJson" class="secondary">返回默认保存文件</button></div>
<p id="jsonSwitchStatus" role="status"><span id="jsonSwitchLabel">正在读取…</span><span id="jsonPath"></span></p></details>
<p id="listStatus" role="status">正在加载…</p>
<div class="toolbar"><label><input id="selectAll" type="checkbox"> 全选本页</label><button id="delete" class="danger" disabled>删除选中（0）</button></div>
<div id="confirmDelete" hidden><p id="confirmText"></p><div class="toolbar"><button id="cancelDelete" class="secondary">取消</button><button id="confirmButton" class="danger">确认删除</button></div></div>
<p id="listError" role="alert"></p><div id="records"></div>
<div class="toolbar pagination"><span id="totalRecords">共 0 条记录</span><div id="paginationControls"><button id="previous" class="secondary" disabled>上一页</button><span id="pageInfo"></span><button id="next" class="secondary" disabled>下一页</button></div></div></section>
</main><script src="recovery.js"></script><script src="popup.js"></script><script src="collect-model.js"></script><script src="prompt-title.js"></script><script src="gallery-capture.js"></script><script src="capture-review.js"></script><script src="ocr-tiles.js"></script><script src="content-capture.js"></script><script src="video-url.js"></script><script src="recovery-page.js"></script><script src="delete-icons.js"></script></body></html>
