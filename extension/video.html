<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频下载 · 精彩摘录</title><link rel="stylesheet" href="prompt.css"><link rel="stylesheet" href="video.css"><link rel="stylesheet" href="video-companion.css"><link rel="stylesheet" href="embedded.css"><link rel="stylesheet" href="task-ui.css"><link rel="stylesheet" href="interface.css"><link rel="stylesheet" href="recovery.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="delete-icons.css"><link rel="stylesheet" href="icon-buttons.css"></head>
<body><main class="video-page"><button id="backToFileList" class="quiet" hidden>← 返回文件列表</button>
<section class="video-card">
<div class="media-input-heading"><label for="url">视频 / 图集 / 流媒体网址</label><button id="hoverToggle" type="button" aria-label="网页视频悬浮下载按钮" aria-pressed="false" title="悬浮下载按钮：正在读取状态" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="m9 8 4 3-4 3zM17 12v9m-3-3 3 3 3-3"/></svg></button></div><input id="url" type="url" placeholder="当前网页、视频详情页、图集或 m3u8 / mpd 链接">
<div class="actions media-acquisition-actions"><button id="extractUrl">识别当前网页</button><button id="inspect">获取视频</button><button id="inspectGallery" class="secondary">获取图集</button></div>
<div class="media-summary" role="status" aria-live="polite"><span id="status" title="检查下载引擎…">检查下载引擎…</span><span id="website"></span><span id="title"></span></div><p id="error" role="alert"></p><p id="hoverError" role="alert"></p>
</section>
<section id="pageMediaCard" class="video-card" hidden><h2>网页中的视频</h2><div id="pageVideos" class="page-media-videos"></div></section>
<section id="qualityCard" class="video-card media-quality-row">
<div class="media-quality-field"><label for="mediaMode">保存类型</label><select id="mediaMode"><option value="video">视频（含声音）</option><option value="audio">仅音频</option></select></div><div id="audioOptions" class="media-quality-field" hidden><label for="audioFormat">音频格式</label><select id="audioFormat"><option value="best">原始最佳音频（避免重复编码）</option><option value="mp3">MP3</option><option value="m4a">M4A</option><option value="flac">FLAC</option></select></div><div id="videoQuality" class="media-quality-field"><label for="height">画质</label><select id="height" disabled><option>请先解析视频</option></select>
</div>
<p id="qualityNotice" class="quality-notice" role="status" hidden></p>
</section>
<section id="companionCard" class="video-card companion-card" hidden><details id="companionDetails" open><summary>配套图文 <span id="companionSummary"></span></summary><div class="companion-content"><p class="hint">自动带入当前视频提供的帖文与封面；下载前可编辑、补图。未提供的内容留空。</p><label for="companionTitle">配套标题</label><input id="companionTitle" maxlength="120" placeholder="可编辑标题"><p id="companionAuthor" class="hint"></p><label for="companionText">帖子正文</label><textarea id="companionText" maxlength="20000" placeholder="可补充帖子说明文字"></textarea><div id="companionImages" class="companion-images" aria-live="polite"></div><div class="companion-actions"><button id="companionChoose" type="button">选择本地图片</button><button id="companionCapture" type="button">区域截图补图</button></div><p id="companionStatus" role="status" aria-live="polite"></p></div></details></section>
<section id="galleryCard" class="video-card" hidden><div class="gallery-toolbar"><div id="galleryTypeFilter"></div><div id="gallerySizeFilter"></div><button id="captureGalleryImage" type="button" class="gallery-capture-button" title="Capture your image · 区域截图" aria-label="区域截图"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 4H6a2 2 0 0 0-2 2v2m12-4h2a2 2 0 0 1 2 2v2M4 16v2a2 2 0 0 0 2 2h2m12-4v2a2 2 0 0 1-2 2h-2M12 8v8m-4-4h8"/></svg></button></div><p id="captureStatus" class="media-status" role="status" aria-live="polite"></p><div class="gallery-selection-row"><p id="galleryCount" aria-live="polite"></p><div class="gallery-selection-actions"><button id="gallerySelectAll">全选</button><button id="gallerySelectNone">取消全选</button></div></div><div id="galleryGrid"></div><p id="galleryDestination" class="hint"></p><button id="confirmGallery">确认下载全部图片</button></section>
<section class="video-card task-card" id="saveLocationCard">
<div class="save-location-toolbar"><label for="directoryInput">保存目录</label><div class="save-location-actions"><button id="openRecent" type="button" title="打开最近下载目录" aria-label="打开最近下载目录"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/><path d="M12 12h7m-3-3 3 3-3 3"/></svg></button></div></div><input id="directoryInput" readonly placeholder="请选择保存目录">
<div class="save-download-actions"><button id="folder" type="button" title="设置保存目录" aria-label="设置保存目录"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/><path d="M12 11v5m-2-2 2 2 2-2"/></svg></button><button id="downloadCompanionToggle" type="button" aria-label="附带配套图文：关闭" aria-pressed="false" title="附带配套图文：关闭（仅下载视频）" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m6.5 16 3.5-3 2.5 2 2.5-3 2.5 4M7 19h10"/></svg></button><button id="download" disabled>开始下载</button></div><pre id="progress"></pre>
<p id="locationStatus" role="status"></p>
<details class="path-details"><summary>查看保存位置</summary><p id="directory"></p></details>

</section>
<details class="login-card"><summary>登录状态 <span id="cookieStatus" role="status">未使用 Cookie</span></summary><div class="login-content">

<div class="actions cookie-actions"><button id="browserCookies">浏览器登录</button><button id="cookies">导入 Cookie</button><button id="clearCookies">清除</button></div>
</div></details>
<details class="login-card"><summary>下载设置 <span>速度与队列</span></summary><div class="login-content"><label for="transferMode">下载速度档位</label><select id="transferMode"><option value="extreme">极限：原生 64 路分段（需额外合并空间）</option><option value="fast">高速：32 段 / 每服务器最多 16 连接</option><option value="balanced">均衡：4 连接</option><option value="compatible">兼容：单连接</option></select><details class="download-settings"><summary>队列与自动归类</summary><div class="login-content"><label for="maxActive">同时下载任务数</label><select id="maxActive"><option value="1">1 个任务</option><option value="2">2 个任务</option><option value="3">3 个任务</option><option value="4">4 个任务</option><option value="5">5 个任务</option><option value="6">6 个任务</option><option value="7">7 个任务</option><option value="8">8 个任务</option></select><label class="file-choice"><input id="autoClassify" type="checkbox"><span>按类型自动归类到视频、音乐、程序、压缩包、模型等目录</span></label><label class="file-choice"><input id="adaptive" type="checkbox" checked><span>慢连接与网络故障自动重试、必要时降低并发</span></label><button id="saveDownloadSettings">保存下载设置</button></div></details></div></details>


<p id="transferStatus" role="status"></p><p id="transferError" role="alert"></p>

<section class="video-card"><div class="section-heading"><h2>下载任务</h2><button id="refreshTasks" class="refresh-icon" title="刷新任务" aria-label="刷新任务"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></button></div><label for="taskFilter">任务状态</label><select id="taskFilter"><option value="unfinished" selected>未完成（默认）</option><option value="all">全部任务</option><option value="active">进行中</option><option value="queued">排队中</option><option value="starting">准备中</option><option value="running">下载中</option><option value="paused">已暂停</option><option value="failed">中断 / 失败</option><option value="completed">已完成</option></select><p class="hint">按创建时间从新到旧排列；删除任务保留下载文件。</p><p id="tasksLoading" class="task-loading" role="status" aria-live="polite" hidden><span class="task-spinner" aria-hidden="true"></span><span>正在加载任务…</span></p><p id="tasksSummary"></p><p id="tasksError" role="alert"></p><div id="tasksList"></div><div class="actions"><button id="tasksPrevious" disabled>上一页</button><button id="tasksNext" disabled>下一页</button></div></section>
</main><script src="recovery.js"></script><script src="media-feedback.js"></script><script src="task-ui.js"></script><script src="video-url.js"></script><script src="gallery-cards.js"></script><script src="gallery-capture.js"></script><script src="screenshot-confirm.js"></script><script src="video-companion.js"></script><script src="video.js"></script><script src="file-list-return.js"></script><script src="transfers.js"></script><script src="recovery-page.js"></script><script src="delete-icons.js"></script></body></html>
